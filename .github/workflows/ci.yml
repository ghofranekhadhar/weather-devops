name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: cd backend && npm install
      - name: Lint
        run: cd backend && npm run lint
      - name: Tests
        run: cd backend && npm test
      - name: Scan dependencies
        run: cd backend && npm audit --audit-level=high || true
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=ghofranekhadhar_weather-devops
            -Dsonar.organization=ghofranekhadhar
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: cd backend && docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/weather-devops:latest .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/weather-devops:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/weather-devops:latest
